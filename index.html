
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AeroCore — Aviation ERP</title>
<style>
:root{
  --navy:#1E2235; --navy2:#2A2F45; --orange:#F7941E; --orangeDk:#E2740A; --orangeSoft:#FFF3E4;
  --page:#F4F5F7; --card:#FFFFFF; --line:#E6E8EC; --text:#1E2235; --sub:#8A8F9C; --link:#2F6BFF;
  --green:#1E9E52; --greenSoft:#E6F6EC; --red:#D64545; --redSoft:#FDE8E8; --blue:#2F6BFF; --blueSoft:#E8F0FF; --purple:#7A5AF8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--page);color:var(--text);display:flex;min-height:100vh}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#D6D8DF;border-radius:8px}
a{color:var(--link);text-decoration:none}

/* Sidebar */
.sidebar{width:238px;background:var(--navy);min-height:100vh;position:sticky;top:0;flex-shrink:0;display:flex;flex-direction:column}
.logo{padding:22px 22px 18px;display:flex;align-items:center;gap:9px}
.logo .mark{width:32px;height:32px;border-radius:9px;background:var(--orange);display:flex;align-items:center;justify-content:center}
.logo span{color:#fff;font-weight:800;font-size:19px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:-.5px}
nav.side{padding:6px 12px;flex:1}
.navbtn{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:2px;border-radius:9px;border:none;background:transparent;color:#B9BDC9;font-size:14px;font-weight:500;text-align:left}
.navbtn:hover{background:var(--navy2);color:#fff}
.navbtn.active{background:var(--orange);color:#fff;font-weight:700}
.orgcard{padding:16px;margin:12px;background:var(--navy2);border-radius:10px}
.orgcard .n{color:#fff;font-size:13px;font-weight:700}
.orgcard .s{color:#8A8F9C;font-size:12px;margin-top:2px}

/* Main */
.main{flex:1;min-width:0}
.topbar{height:62px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:30}
.crumb{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:14px}
.crumb b{color:var(--text)}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--page);border-radius:8px;padding:8px 12px;width:260px}
.searchbox input{border:none;background:none;outline:none;font-size:14px;font-family:inherit;width:100%}
.topright{display:flex;align-items:center;gap:18px}
.bell{position:relative}
.bell .dot{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--orange);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.me{display:flex;align-items:center;gap:9px}
.ava{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#F7941E,#E2740A);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.me .nm{font-size:13px;font-weight:700}.me .rl{font-size:11px;color:var(--sub)}
main.content{padding:26px 30px 60px;max-width:1400px;margin:0 auto}

/* Bits */
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
.pagehead h1{font-size:28px;font-weight:800}
.pagehead p{color:var(--sub);margin-top:6px;font-size:14px}
.row{display:flex;gap:10px}
.btn{background:#fff;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:#C9CCD4}
.btn.primary{background:var(--orange);color:#fff;border:none}
.btn.primary:hover{background:var(--orangeDk)}
.btn.ghost{background:transparent}
.btn svg{width:15px;height:15px}
.card{background:var(--card);border-radius:12px;border:1px solid var(--line)}
.pad{padding:22px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse}
th{padding:13px 18px;color:var(--sub);font-size:12px;font-weight:600;text-align:left;white-space:nowrap}
td{padding:13px 18px;color:var(--text);font-size:14px;white-space:nowrap;border-top:1px solid var(--line)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#FAFBFC}
.tablewrap{overflow:auto}
.link{color:var(--link);font-weight:600}
.b7{font-weight:700}.b6{font-weight:600}
.pill{border-radius:20px;padding:4px 11px;font-size:12px;font-weight:700;white-space:nowrap;display:inline-block}
.kpi{padding:20px}
.kpi .ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.kpi .val{font-size:26px;font-weight:800;margin-top:14px}
.kpi .lab{color:var(--sub);font-size:13px;margin-top:2px}
.delta{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:700}
.minicard{padding:18px}.minicard .v{font-size:24px;font-weight:800}.minicard .l{color:var(--sub);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;width:fit-content;margin-bottom:16px}
.tabs button{border:none;background:transparent;border-radius:7px;padding:9px 20px;font-weight:700;font-size:14px;color:var(--text)}
.tabs button.on{background:var(--orange);color:#fff}
.sectitle{font-weight:700;font-size:16px;margin:26px 0 12px}
.sectitle:first-child{margin-top:0}

/* chart */
.bars{display:flex;align-items:flex-end;gap:8px;height:180px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bars .bar{width:100%;border-radius:5px 5px 0 0;background:var(--navy);opacity:.85}
.bars .bar.last{background:var(--orange);opacity:1}
.bars .m{font-size:10px;color:var(--sub)}
.prog{height:8px;background:var(--page);border-radius:6px;overflow:hidden}
.prog>div{height:100%}

/* schedule */
.sched{display:grid;grid-template-columns:110px repeat(7,1fr);min-width:840px}
.sched .hcell{padding:13px 18px;color:var(--sub);font-size:12px;font-weight:600;border-bottom:1px solid var(--line)}
.sched .hcell.day{text-align:center;border-left:1px solid var(--line)}
.sched .tail{padding:16px 18px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.sched .slot{padding:6px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);min-height:56px}
.leg{border-radius:6px;padding:6px 8px;font-size:11px;font-weight:600;height:100%}
.leg.c{background:var(--navy);color:#fff}
.leg.e{background:var(--orangeSoft);color:var(--orange)}
.leg .rt{display:flex;align-items:center;gap:3px}.leg .k{opacity:.75;margin-top:2px}

/* alerts */
.alert{display:flex;gap:12px;padding:12px;border-radius:8px;align-items:center}
.alert .ai{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.alert .t{font-weight:600;font-size:14px}.alert .s{color:var(--sub);font-size:12px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(30,34,53,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:640px;max-width:100%;max-height:88vh;overflow:auto;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:24px;font-weight:800}
.modal .close{background:none;border:none;color:var(--sub);float:right}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:14px;font-family:inherit;outline:none}
.field input:focus,.field select:focus{border-color:var(--orange)}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:none}.kv .k{color:var(--sub)}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:13px 22px;border-radius:10px;font-size:14px;font-weight:600;z-index:80;opacity:0;transition:.3s;display:flex;align-items:center;gap:9px}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.iconbtn{background:none;border:none;color:var(--sub);padding:4px;border-radius:6px}
.iconbtn:hover{background:var(--page);color:var(--red)}
</style>
</head>

/* ============ helpers to render tables ============ */

let toastT;

  btn('Close','','ghost','closeModal()')+btn('Mark complete','','primary',`completeWO('${m.wo}')`)));}
function crewModal(n){const c=DB.crew.find(x=>x.name===n);openModal(modalShell(n,
  `${[['Role',c.role],['Type rating',c.type],['Flight time (28d)',c.ftime],['Licence',c.licence],['Medical',c.medical]].map(kv=>`<div class="kv"><span class="k">${kv[0]}</span><span class="b6">${kv[1]}</span></div>`).join('')}<div class="kv"><span class="k">Status</span>${pill(c.status)}</div>`,
  btn('Close','','ghost','closeModal()')+btn('Roster','cal','primary',`closeModal();toast('${n} roster opened')`)));}
function leadModal(i){const l=DB.leads[i];openModal(modalShell(`${l.client}`,
  `${[['Contact',l.contact],['Route',l.route],['Value',l.value],['Owner',l.owner]].map(kv=>`<div class="kv"><span class="k">${kv[0]}</span><span class="b6">${kv[1]}</span></div>`).join('')}<div class="kv"><span class="k">Stage</span>${pill(l.stage)}</div>`,
  btn('Mark lost','','ghost',`setLead(${i},'Lost')`)+btn('Mark won','','primary',`setLead(${i},'Won')`)));}
function invoiceModal(no){const v=DB.invoices.find(x=>x.no===no);openModal(modalShell(`${v.no}`,
  `${[['Client',v.client],['Trip',v.trip],['Amount',v.amount],['Issued',v.issued],['Due',v.due]].map(kv=>`<div class="kv"><span class="k">${kv[0]}</span><span class="b6">${kv[1]}</span></div>`).join('')}<div class="kv"><span class="k">Status</span>${pill(v.status)}</div>`,
  btn('Download PDF','down','ghost',`closeModal();toast('${v.no} downloaded')`)+(v.status!=='Paid'?btn('Mark paid','','primary',`payInvoice('${v.no}')`):btn('Close','','primary','closeModal()'))));}
function partModal(pn){const p=DB.parts.find(x=>x.pn===pn);openModal(modalShell(`${p.pn}`,
  `${[['Description',p.name],['Aircraft',p.ac],['On hand',p.qty],['Minimum',p.min],['Location',p.loc]].map(kv=>`<div class="kv"><span class="k">${kv[0]}</span><span class="b6">${kv[1]}</span></div>`).join('')}<div class="kv"><span class="k">Status</span>${pill(p.status)}</div>`,
  btn('Close','','ghost','closeModal()')+btn('Reorder','plus','primary',`closeModal();toast('${p.pn} reorder placed')`)));}
function docModal(ref){const d=DB.docs.find(x=>x.ref===ref);openModal(modalShell(`${d.name}`,
  `${[['Reference',d.ref],['Applies to',d.owner],['Expires',d.expires]].map(kv=>`<div class="kv"><span class="k">${kv[0]}</span><span class="b6">${kv[1]}</span></div>`).join('')}<div class="kv"><span class="k">Status</span>${pill(d.status)}</div>`,
  btn('Close','','ghost','closeModal()')+btn('Renew','','primary',`closeModal();toast('${d.name} renewal started')`)));}

/* create/add modals with working forms */
function formField(label,id,type='text',opts){return `<div class="field"><label>${label}</label>${opts?`<select id="${id}">${opts.map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="${id}" type="${type}" placeholder="${label}">`}</div>`;}

function addAircraftModal(){openModal(modalShell('Add aircraft',
  formField('Tail number','f_tail')+formField('Model','f_model')+formField('Category','f_cat',null,['Turboprop','Light jet','Midsize jet','Super midsize','Heavy jet','Ultra-long'])+formField('Passengers','f_pax','number')+formField('Home base','f_base'),
  btn('Cancel','','ghost','closeModal()')+btn('Add aircraft','plus','primary','saveAircraft()')));}
function saveAircraft(){const t=val('f_tail')||'NEW-'+Math.floor(Math.random()*900+100);DB.fleet.push({tail:t,model:val('f_model')||'New aircraft',cat:val('f_cat'),pax:val('f_pax')||6,yom:2024,base:val('f_base')||'—',hrs:'0',next:'—',rate:'€ —/h',status:'Available'});closeModal();render();toast(t+' added to fleet');}

function newFlightModal(){openModal(modalShell('New flight',
  formField('Aircraft','f_ac',null,DB.fleet.map(f=>f.tail))+formField('Departure (ICAO)','f_dep')+formField('Arrival (ICAO)','f_arr')+formField('ETD','f_etd')+formField('Passengers','f_pax','number')+formField('Type','f_type',null,['Charter','Empty leg','Positioning']),
  btn('Cancel','','ghost','closeModal()')+btn('Create flight','plus','primary','saveFlight()')));}
function saveFlight(){const id='FLT-'+Math.floor(Math.random()*9000+2000);DB.flights.unshift({id,tail:val('f_ac'),dep:val('f_dep')||'—',arr:val('f_arr')||'—',etd:val('f_etd')||'TBD',eta:'TBD',pax:val('f_pax')||1,crew:'Unassigned',type:val('f_type'),status:'Scheduled'});closeModal();render();toast(id+' scheduled');}

function newWOModal(){openModal(modalShell('New work order',
  formField('Aircraft','f_ac',null,DB.fleet.map(f=>f.tail))+formField('Task','f_task')+formField('Type','f_type',null,['Scheduled','Unscheduled'])+formField('Mechanic','f_mech')+formField('Estimated hours','f_est'),
  btn('Cancel','','ghost','closeModal()')+btn('Create WO','plus','primary','saveWO()')));}
function saveWO(){const wo='WO-'+Math.floor(Math.random()*9000+1000);DB.maint.unshift({wo,tail:val('f_ac'),task:val('f_task')||'New task',type:val('f_type'),due:'Pending',mech:val('f_mech')||'Unassigned',est:(val('f_est')||'—')+' h',status:'Open'});closeModal();render();toast(wo+' created');}

function addCrewModal(){openModal(modalShell('Add crew member',
  formField('Name','f_name')+formField('Role','f_role',null,['Captain','First Officer','Cabin Crew'])+formField('Type rating','f_type')+formField('Licence','f_lic'),
  btn('Cancel','','ghost','closeModal()')+btn('Add crew','plus','primary','saveCrew()')));}
function saveCrew(){DB.crew.push({name:val('f_name')||'New crew',role:val('f_role'),type:val('f_type')||'—',ftime:'0h / 100h',licence:(val('f_lic')||'—')+' — Valid',medical:'Class 1 — —',status:'Off duty'});closeModal();render();toast('Crew member added');}

function newLeadModal(){openModal(modalShell('New lead',
  formField('Client','f_client')+formField('Contact','f_contact')+formField('Route','f_route')+formField('Value (€)','f_value')+formField('Owner','f_owner'),
  btn('Cancel','','ghost','closeModal()')+btn('Add lead','plus','primary','saveLead()')));}
function saveLead(){DB.leads.unshift({client:val('f_client')||'New client',contact:val('f_contact')||'—',route:val('f_route')||'—',value:'€ '+(val('f_value')||'0'),owner:val('f_owner')||'—',stage:'Open'});closeModal();render();toast('Lead added to pipeline');}

function createInvoiceModal(){openModal(modalShell('Create invoice',
  formField('Client','f_client',null,DB.clients.map(c=>c.name))+formField('Trip','f_trip')+formField('Amount (€)','f_amount')+formField('Due date','f_due'),
  btn('Cancel','','ghost','closeModal()')+btn('Create invoice','plus','primary','saveInvoice()')));}
function saveInvoice(){const no='INV-2024-0'+Math.floor(Math.random()*900+189);DB.invoices.unshift({no,client:val('f_client'),trip:val('f_trip')||'—',amount:'€ '+(val('f_amount')||'0'),issued:'Today',due:val('f_due')||'—',status:'Pending'});closeModal();render();toast(no+' created');}

function addPartModal(){openModal(modalShell('Add part',
  formField('Part number','f_pn')+formField('Description','f_name')+formField('Aircraft','f_ac')+formField('Quantity','f_qty','number')+formField('Min level','f_min','number')+formField('Location','f_loc'),
  btn('Cancel','','ghost','closeModal()')+btn('Add part','plus','primary','savePart()')));}
function savePart(){const q=parseInt(val('f_qty'))||0,mn=parseInt(val('f_min'))||1;DB.parts.push({pn:val('f_pn')||'PN-'+Math.floor(Math.random()*9000),name:val('f_name')||'New part',ac:val('f_ac')||'—',qty:q,min:mn,loc:val('f_loc')||'—',status:q===0?'Out of stock':q<=mn?'Low stock':'In stock'});closeModal();render();toast('Part added to inventory');}

function uploadDocModal(){openModal(modalShell('Upload document',
  formField('Document name','f_name')+formField('Reference','f_ref')+formField('Applies to','f_owner')+formField('Expires','f_exp'),
  btn('Cancel','','ghost','closeModal()')+btn('Upload','down','primary','saveDoc()')));}
function saveDoc(){DB.docs.unshift({name:val('f_name')||'New document',ref:val('f_ref')||'—',owner:val('f_owner')||'Company',expires:val('f_exp')||'—',status:'Valid'});closeModal();render();toast('Document uploaded');}

function quoteModal(){openModal(modalShell('New quote',
  formField('Client','f_client')+formField('Route','f_route')+formField('Aircraft','f_ac',null,DB.fleet.map(f=>f.tail))+formField('Price (€)','f_price'),
  btn('Cancel','','ghost','closeModal()')+btn('Send quote','','primary',"closeModal();toast('Quote sent to client')")));}

/* actions that mutate + refresh */
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function completeWO(wo){const m=DB.maint.find(x=>x.wo===wo);m.status='Completed';m.due='Completed';closeModal();render();toast(wo+' marked complete');}
function payInvoice(no){DB.invoices.find(x=>x.no===no).status='Paid';closeModal();render();toast(no+' marked paid');}
function setLead(i,stage){DB.leads[i].stage=stage;closeModal();render();toast('Lead marked '+stage);}

/* ============ RENDER ============ */
function render(){document.getElementById('content').innerHTML=PAGES[current]();}
buildNav();render();
</script>
</body>
</html>
